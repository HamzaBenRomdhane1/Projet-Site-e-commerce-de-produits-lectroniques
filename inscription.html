!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - TechStore.tn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">TechStore.tn</div>
        <nav class="nav">
            <a href="index.html">Accueil</a>
            <a href="inscription.html">S'inscrire</a>
            <a href="produits.html">Produits & Commandes</a>
        </nav>
    </header>

    <div class="form-container">
        <h1>Créer votre compte TechStore.tn</h1>
        <form id="inscriptionForm" novalidate>
            <!-- Tout le formulaire complet (je te le remets entier) -->
            <fieldset>
                <legend>Informations personnelles</legend>
                <div class="field"><label>Nom <span class="required">*</span></label><input type="text" id="nom" required></div>
                <div class="field"><label>Prénom <span class="required">*</span></label><input type="text" id="prenom" required></div>
                <div class="field"><label>Email <span class="required">*</span></label><input type="email" required></div>
                <div class="field"><label>Téléphone</label><input type="tel"></div>
                <div class="field"><label>Date de naissance</label><input type="date"></div>
            </fieldset>

            <fieldset>
                <legend>Compte</legend>
                <div class="field"><label>Nom d'utilisateur <span class="required">*</span></label><input type="text" required></div>
                <div class="field">
                    <label>Mot de passe <span class="required">*</span></label>
                    <input type="password" id="password" required>
                    <div class="password-strength"><div class="bar"></div><small>Force : <span id="strengthText">Faible</span></small></div>
                </div>
                <div class="field"><label>Confirmer <span class="required">*</span></label><input type="password" required></div>
            </fieldset>

            <fieldset>
                <legend>Préférences</legend>
                <div class="field">
                    <label>Sexe</label>
                    <select>
                        <option value="homme">Homme</option>
                        <option value="femme">Femme</option>
                        <option value="autre">Autre</option>
                    </select>
                <div class="field"><label>Pays</label><select><option>Tunisie</option><option>algerie</option></select></div>
            </fieldset>

            <div class="field"><label><input type="checkbox" required><strong>J'accepte les CGU</strong></span></label></div>

            <div class="buttons">
                <button type="submit" class="btn">S'inscrire</button>
                <button type="reset" class="btn reset">Réinitialiser</button>
            </div>
        </form>
        <div id="successMessage" class="success hidden"><strong>Inscription réussie !</strong></div>
    </div>

    <footer class="footer">
        <p>Contact : contact@techstore.tn | WhatsApp : +216 98 123 456</p>
        <p>© 2025 TechStore.tn</p>
    </footer>

    <script src="script-inscription.js"></script>
</body>
</html>
